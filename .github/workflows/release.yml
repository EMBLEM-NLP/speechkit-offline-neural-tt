name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag: {description: 'Release tag matching the narration package version', default: 'v1.3.0'}
permissions:
  contents: write
jobs:
  runtime-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Verify source and build narration packages
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python scripts/source_ledger.py
          python -c 'import os,tomllib; from pathlib import Path; version=tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]; assert os.environ["TAG"] == "v"+version, "release tag must match package version"'
          python -m pip install build
          python -m build
      - uses: actions/checkout@v4
        with: {ref: runtime-assets, path: assets}
      - name: Reassemble and verify the runtime archive
        run: |
          cat assets/runtime.zip.part-* > EMBLEM-NLP_Offline_Neural_Runtime_Linux_Py313.zip
          PIN=$(grep -o "'[a-f0-9]\{64\}'" bootstrap.py | head -1 | tr -d "'")
          echo "$PIN  EMBLEM-NLP_Offline_Neural_Runtime_Linux_Py313.zip" | sha256sum -c -
      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to replace published artifacts." >&2
            exit 1
          fi
          gh release create "$TAG" EMBLEM-NLP_Offline_Neural_Runtime_Linux_Py313.zip dist/* \
            --target "${{ github.sha }}" --title "SpeechKit Voice TTS Offline Pipeline ${TAG#v}" \
            --notes "SpeechKit Voice TTS Offline Pipeline. Offline neural text-to-speech and narration pipeline with pronunciation auditing, resumable synthesis, word timings and chapter exports. Includes the narration wheel and source package plus the unchanged pinned Linux runtime archive. GPL-3.0-or-later."
