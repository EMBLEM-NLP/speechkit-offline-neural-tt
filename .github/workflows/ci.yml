name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: speechkit-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    env:
      SPEECHKIT_SKIP_BROWSER: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: '3.11'}
          - {os: ubuntu-24.04, python: '3.13'}
          - {os: macos-15, python: '3.12'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/source_ledger.py
      - run: python -m unittest discover -s tests -t . -v
      - run: python -m unittest discover -s speechkit/tests -v
      - name: Check the authored cue contract without synthesis
        run: python scripts/explainer_narration.py --input-package examples/explainer_chapter02/pilot.json --output-root artifacts/script-pilot --stage script
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python -m pip install build
      - run: python -m build
      - name: Verify an installed wheel outside the checkout
        env:
          SPEECHKIT_CHECKOUT: ${{ github.workspace }}
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-env/bin/python" "$GITHUB_WORKSPACE/scripts/check_installed_package.py"
      - uses: actions/upload-artifact@v4
        with:
          name: speechkit-package-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python -m pip install -r requirements.txt playwright==1.64.1
      - run: python -m playwright install --with-deps chromium
      - name: Verify the audit page with and without JavaScript
        run: python -m unittest tests.narration.test_audit_report.PageInBrowser -v
  voice:
    needs: [core, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SPEECHKIT_CHECKOUT: ${{ github.workspace }}
      SPEECHKIT_HOME: ${{ github.workspace }}/.speechkit-home
      SPEECHKIT_RUNTIME: ${{ github.workspace }}/installed/runtime
      SPEECHKIT_ASR_MODELS: ${{ github.workspace }}/.speechkit-home/models
      SPEECHKIT_CACHE: ${{ github.workspace }}/.speechkit-home/cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - name: Install the published SpeechKit 1.3.1 wheel and voice dependencies
        run: |
          python -m venv "$RUNNER_TEMP/coordinator"
          "$RUNNER_TEMP/coordinator/bin/python" -m pip install -r requirements-voice.txt -c constraints-voice.txt --report install-report.json
          curl --fail --location --output "$RUNNER_TEMP/pipeline.whl.download" https://github.com/EMBLEM-NLP/speechkit-voice-tts-offline-pipeline/releases/download/v1.3.1/speechkit_voice_tts_offline_pipeline-1.3.1-py3-none-any.whl
          echo "c981f08fb106722e32cc3eb8e13d45f24c3d502d458f6b1214cc0058a2a6a823  $RUNNER_TEMP/pipeline.whl.download" | sha256sum -c -
          mv "$RUNNER_TEMP/pipeline.whl.download" "$RUNNER_TEMP/speechkit_voice_tts_offline_pipeline-1.3.1-py3-none-any.whl"
          "$RUNNER_TEMP/coordinator/bin/python" -m pip install --no-deps "$RUNNER_TEMP/speechkit_voice_tts_offline_pipeline-1.3.1-py3-none-any.whl"
      - name: Provision the unchanged pinned voice runtime
        run: |
          python bootstrap.py fetch
          python bootstrap.py verify
          python bootstrap.py install --out installed
          python -m unittest tests.test_bundle -v
      - name: Bind execution to the installed release outside the checkout
        run: |
          mkdir -p artifacts/environment "$RUNNER_TEMP/isolated_adapter"
          cp scripts/explainer_narration.py "$RUNNER_TEMP/isolated_adapter/"
          cp install-report.json artifacts/environment/
          "$RUNNER_TEMP/coordinator/bin/python" scripts/record_runtime.py artifacts/environment/runtime.json
          "$RUNNER_TEMP/coordinator/bin/python" -m pip freeze --all > artifacts/environment/coordinator-packages.txt
          installed/runtime/.venv/bin/python -m pip freeze --all > artifacts/environment/voice-packages.txt
          cd "$RUNNER_TEMP"
          unset PYTHONPATH
          "$RUNNER_TEMP/coordinator/bin/python" - <<'PY'
          import hashlib, importlib.metadata, json, os
          from pathlib import Path
          import speechkit_narrate
          package = Path(speechkit_narrate.__file__).resolve()
          assert package.is_relative_to(Path(os.environ['RUNNER_TEMP']) / 'coordinator'), package
          version = importlib.metadata.version('speechkit-voice-tts-offline-pipeline')
          assert version == '1.3.1', version
          wheel = Path(os.environ['RUNNER_TEMP']) / 'speechkit_voice_tts_offline_pipeline-1.3.1-py3-none-any.whl'
          receipt = {'distribution': 'speechkit-voice-tts-offline-pipeline', 'version': version,
                     'package_file': str(package), 'working_directory': str(Path.cwd()),
                     'wheel_sha256': hashlib.sha256(wheel.read_bytes()).hexdigest(),
                     'adapter_sha256': hashlib.sha256((Path(os.environ['RUNNER_TEMP']) / 'isolated_adapter/explainer_narration.py').read_bytes()).hexdigest()}
          (Path(os.environ['GITHUB_WORKSPACE']) / 'artifacts/environment/installed-release.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt))
          PY
          "$RUNNER_TEMP/coordinator/bin/python" -m speechkit_narrate setup
          "$RUNNER_TEMP/coordinator/bin/python" -m speechkit_narrate --json doctor > "$GITHUB_WORKSPACE/artifacts/environment/doctor.json"
      - name: Produce the Chapter 3 pilot, audition and full narration with audit evidence
        run: |
          cd "$RUNNER_TEMP"
          unset PYTHONPATH
          for scope in pilot glossary full; do
            "$RUNNER_TEMP/coordinator/bin/python" "$RUNNER_TEMP/isolated_adapter/explainer_narration.py" --input-package "$GITHUB_WORKSPACE/examples/explainer_chapter03/$scope.json" --output-root "$GITHUB_WORKSPACE/artifacts/explainer_$scope" --profile ljspeech-high --workers 1 --audit
          done
          "$RUNNER_TEMP/coordinator/bin/python" "$GITHUB_WORKSPACE/scripts/check_rename_resume.py" "$GITHUB_WORKSPACE/artifacts/explainer_full" "$GITHUB_WORKSPACE/artifacts/environment/chapter03-resume-before.json" --snapshot
          "$RUNNER_TEMP/coordinator/bin/python" "$RUNNER_TEMP/isolated_adapter/explainer_narration.py" --input-package "$GITHUB_WORKSPACE/examples/explainer_chapter03/full.json" --output-root "$GITHUB_WORKSPACE/artifacts/explainer_full" --profile ljspeech-high --workers 1 --audit
          "$RUNNER_TEMP/coordinator/bin/python" "$GITHUB_WORKSPACE/scripts/check_rename_resume.py" "$GITHUB_WORKSPACE/artifacts/explainer_full" "$GITHUB_WORKSPACE/artifacts/environment/chapter03-resume-before.json" > "$GITHUB_WORKSPACE/artifacts/environment/chapter03-resume-result.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: speechkit-chapter03-r2-v131-${{ github.run_id }}
          path: |
            artifacts/
            !artifacts/**/writer.json
            !artifacts/**/writer.lock
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  powershell:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python -m pip install -r requirements.txt
      - name: Pester tests of the SpeechKitVoiceTtsOfflinePipeline module
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force
          Invoke-Pester -Path ./powershell/Tests -Output Detailed -CI
